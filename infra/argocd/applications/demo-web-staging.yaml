apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-web-staging
  namespace: argocd
spec:
  project: default

  source:

    repoURL: https://github.com/reyes44/homelab-k8s.git
    targetRevision: staging
    path: apps/demo-web/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

controller:
  replicaCount: 1

  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.88.250

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  ingressClass: nginx

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

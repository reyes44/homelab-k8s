apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-web-content
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Homelab Kubernetes Demo</title>
      <link rel="stylesheet" href="style.css" />
    </head>
    <body>
      <main class="container">
        <section class="card">
          <p class="badge">Kubernetes GitOps Lab</p>
          <h1>Demo Web en k3s</h1>
          <p>
            Esta web está desplegada en Kubernetes usando Argo CD,
            ingress-nginx, MetalLB y cert-manager.
          </p>

          <div class="grid">
            <div>
              <span>Entorno</span>
              <strong>Staging / Prod</strong>
            </div>
            <div>
              <span>Gestionado por</span>
              <strong>Argo CD</strong>
            </div>
            <div>
              <span>Entrada</span>
              <strong>Ingress NGINX</strong>
            </div>
          </div>

          <p class="footer">
            Cambia colores en <code>style.css</code>, haz push y Argo CD sincronizará la web.
          </p>
        </section>
      </main>
    </body>
    </html>

  style.css: |
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f97316;
      --accent-secondary: #a855f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.20), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: 100%;
      max-width: 900px;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 28px;
      padding: 48px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .badge {
      display: inline-block;
      margin: 0 0 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 72px);
      line-height: 1;
    }

    p {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.6;
      max-width: 760px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 36px;
    }

    .grid div {
      padding: 22px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .grid span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .grid strong {
      color: var(--accent-secondary);
      font-size: 18px;
    }

    code {
      color: var(--accent);
    }

    .footer {
      margin-top: 34px;
      font-size: 16px;
    }

    @media (max-width: 720px) {
      .card {
        padding: 28px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

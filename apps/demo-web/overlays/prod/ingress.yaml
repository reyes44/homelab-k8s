apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-web
  namespace: demo-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-cloudflare
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.creyeshomelab.xyz
      secretName: demo-web-tls
  rules:
    - host: demo.creyeshomelab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-web
                port:
                  number: 80
